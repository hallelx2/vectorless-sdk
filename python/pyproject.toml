[project]
name = "vectorless-sdk"
version = "1.0.1"
description = "Official Python SDK for Vectorless — structure-preserving document retrieval without embeddings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Vectorless", email = "sdk@vectorless.dev" }]
classifiers = [
    "Typing :: Typed",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "vectorless",
    "document-retrieval",
    "rag",
    "llm",
    "ai",
    "structure-preserving",
    "no-embeddings",
    "sdk",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://vectorless.dev"
Documentation = "https://docs.vectorless.dev"
Repository = "https://github.com/hallelx2/vectorless-sdk"
Issues = "https://github.com/hallelx2/vectorless-sdk/issues"

[project.optional-dependencies]
grpc = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vectorless"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.pytest.ini_options]
asyncio_mode = "auto"
